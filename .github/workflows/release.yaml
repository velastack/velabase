name: release

# Tag pushes (vX.Y.Z) publish a release; everything else builds a snapshot.
# sync.yaml calls it directly because tags pushed with GITHUB_TOKEN don't
# trigger other workflows.

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: bash scripts/check.sh

      - name: Snapshot unless releasing a tag
        if: ${{ !inputs.tag && !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> "$GITHUB_ENV"

      - name: PocketBase + plugin versions for the release notes
        run: |
          echo "PB_VERSION=$(go list -m -f '{{.Version}}' github.com/pocketbase/pocketbase)" >> "$GITHUB_ENV"
          echo "OW_VERSION=$(go list -m -f '{{.Version}}' github.com/velastack/pocketbase-openworkflow)" >> "$GITHUB_ENV"
          echo "WA_VERSION=$(go list -m -f '{{.Version}}' github.com/velastack/pocketbase-whatsapp)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
